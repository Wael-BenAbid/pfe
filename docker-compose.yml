services:
  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://backend:8000
    # Nous ne montons pas le répertoire du projet pour éviter d'écraser les fichiers construits
    # volumes:
    #   - ./project:/app
    #   - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "npm", "run", "health"]
      interval: 30s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  backend:
    image: waelbenabid/rh-backend-desktop:latest
    ports:
      - "8000:8000"
    env_file:
      - ./back-end/.env
    environment:
      - ADMIN_USERNAME=wael
      - ADMIN_EMAIL=waelbenabid1@gmail.com
      - ADMIN_PASSWORD=Abidos$123
      - ADMIN_FIRSTNAME=Wael
      - ADMIN_LASTNAME=Ben Abid
      - DEBUG=True
      - DATABASE_NAME=rh_v2
      - DATABASE_USER=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      # Les informations sensibles comme DATABASE_PASSWORD, SECRET_KEY et SENDGRID_API_KEY
      # doivent être définies dans le fichier .env, pas ici
    volumes:
      - ./back-end:/app
      # Assurez-vous que les répertoires de médias et statiques persistent
      - backend_media:/app/media_v2
      - backend_static:/app/static
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Utiliser le script entrypoint.sh pour démarrer l'application
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]

  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=rh_v2
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_media:
  backend_static:
