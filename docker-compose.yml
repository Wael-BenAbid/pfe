services:
  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://backend:8000/api
    volumes:
      - ./project:/app
      - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "npm", "run", "health"]
      interval: 30s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./back-end/.env
    environment:
      - DEBUG=True
      - DATABASE_NAME=rh_v2
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=12345
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=5433
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
    volumes:
      - ./back-end:/app
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Commande simplifiée pour démarrer l'application
    command: >
      bash -c "
        # Attendre que la base de données soit prête
        echo 'Waiting for PostgreSQL to start...'
        until pg_isready -h host.docker.internal -p 5433; do
          echo 'PostgreSQL is unavailable - sleeping'
          sleep 1
        done
        echo 'PostgreSQL started!'

        # Appliquer les migrations
        echo 'Applying migrations...'
        python manage.py migrate --noinput

        # Créer un superutilisateur si nécessaire
        echo 'Creating superuser if needed...'
        python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='wael').exists() or User.objects.create_superuser('wael', 'wael@example.com', 'Azerty\$123'); print('Superuser created or already exists.')\"

        # Démarrer le serveur
        echo 'Starting server...'
        python manage.py runserver 0.0.0.0:8000
      "

  # Le service db est commenté car nous utilisons la base de données locale

networks:
  app-network:
    driver: bridge
