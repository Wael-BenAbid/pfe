services:
  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://backend:8000/api
    # Nous ne montons pas le répertoire du projet pour éviter d'écraser les fichiers construits
    # volumes:
    #   - ./project:/app
    #   - /app/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "npm", "run", "health"]
      interval: 30s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./back-end/.env
    environment:
      - DEBUG=True
      - DATABASE_NAME=rh_v2
      - DATABASE_USER=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      # Les informations sensibles comme DATABASE_PASSWORD, SECRET_KEY et SENDGRID_API_KEY
      # doivent être définies dans le fichier .env, pas ici
    volumes:
      - ./back-end:/app
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Commande simplifiée pour démarrer l'application
    command: >
      bash -c "
        # Attendre que la base de données soit prête
        echo 'Waiting for PostgreSQL to start...'
        until pg_isready -h db -p 5432; do
          echo 'PostgreSQL is unavailable - sleeping'
          sleep 1
        done
        echo 'PostgreSQL started!'

        # Appliquer les migrations
        echo 'Applying migrations...'
        python manage.py migrate --noinput

        # Créer un superutilisateur si nécessaire
        echo 'Creating superuser if needed...'
        python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='wael').exists() or User.objects.create_superuser('wael', 'wael@example.com', 'Azerty\$123'); print('Superuser created or already exists.')\"

        # Démarrer le serveur
        echo 'Starting server...'
        python manage.py runserver 0.0.0.0:8000
      "

  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=rh_v2
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
