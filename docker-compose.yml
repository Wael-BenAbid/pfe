services:
  frontend:
    image: waelbenabid/rh-frontend:latest
    ports:
      - "5175:80"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_ZIPKIN_URL=http://localhost:9411
      - VITE_ZIPKIN_ENABLED=true
    depends_on:
      - backend
      - zipkin
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health.txt || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  backend:
    image: waelbenabid/rh-system-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./back-end/.env
    environment:
      - ADMIN_USERNAME=wael
      - ADMIN_EMAIL=waelbenabid1@gmail.com
      - ADMIN_PASSWORD=Abidos$123
      - ADMIN_FIRSTNAME=Wael
      - ADMIN_LASTNAME=Ben Abid
      - DEBUG=True
      - DATABASE_NAME=rh_v2
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=12345
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - ZIPKIN_ENABLED=True
      - ZIPKIN_SERVER_URL=http://zipkin:9411
      - ZIPKIN_SERVICE_NAME=rh-backend
      - ZIPKIN_SAMPLE_RATE=100.0
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DEFAULT_FROM_EMAIL=RH System <waelbenabid1@gmail.com>
      - FRONTEND_URL=http://localhost:3000
      # Les informations sensibles comme DATABASE_PASSWORD, SECRET_KEY et SENDGRID_API_KEY
      # doivent être définies dans le fichier .env, pas ici
    volumes:
      - ./back-end:/app
      # Assurez-vous que les répertoires de médias et statiques persistent
      - backend_media:/app/media_v2
      - backend_static:/app/static
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Utiliser le script entrypoint.sh pour démarrer l'application
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]

  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=rh_v2
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
      - JAVA_OPTS=-Xms512m -Xmx512m
      # Activer CORS pour permettre les requêtes depuis le frontend
      - ZIPKIN_UI_CORS_ALLOWED_ORIGINS=*
      - ZIPKIN_UI_CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - ZIPKIN_UI_CORS_ALLOWED_HEADERS=Origin,X-Requested-With,Content-Type,Accept,Authorization
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_media:
  backend_static:
