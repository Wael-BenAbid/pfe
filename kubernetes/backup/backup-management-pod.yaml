apiVersion: v1
kind: Pod
metadata:
  name: postgres-backup-management
  namespace: rh-system
spec:
  containers:
  - name: postgres-backup-management
    image: mcr.microsoft.com/azure-cli:latest
    command:
    - /bin/bash
    - -c
    - "apt-get update && apt-get install -y postgresql-client && while true; do sleep 3600; done"
    volumeMounts:
    - name: backup-volume
      mountPath: /backup
    - name: backup-scripts
      mountPath: /scripts
    env:
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-secrets
          key: POSTGRES_PASSWORD
    - name: AZURE_STORAGE_KEY
      valueFrom:
        secretKeyRef:
          name: postgres-backup-secrets
          key: AZURE_STORAGE_KEY
  volumes:
  - name: backup-volume
    persistentVolumeClaim:
      claimName: postgres-backup-pvc
  - name: backup-scripts
    configMap:
      name: postgres-backup-scripts
      defaultMode: 0755
