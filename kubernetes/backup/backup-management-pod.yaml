apiVersion: v1
kind: Pod
metadata:
  name: postgres-backup-management
spec:
  containers:
  - name: postgres-backup-management
    image: postgres:15-alpine
    command:
    - /bin/sh
    - -c
    - "apk add --no-cache curl && while true; do sleep 3600; done"
    volumeMounts:
    - name: backup-volume
      mountPath: /backup
    - name: backup-scripts
      mountPath: /scripts
    env:
    - name: POSTGRES_PASSWORD
      value: "postgres"
    - name: AZURE_STORAGE_KEY
      value: "default-key-for-development-only"
  volumes:
  - name: backup-volume
    persistentVolumeClaim:
      claimName: postgres-backup-pvc
  - name: backup-scripts
    configMap:
      name: postgres-backup-scripts
      defaultMode: 0755
