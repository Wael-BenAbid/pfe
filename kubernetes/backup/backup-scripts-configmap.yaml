apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-scripts
  namespace: rh-system
data:
  backup.sh: |
    #!/bin/sh
    set -e

    # Configuration
    BACKUP_DIR="/backup"
    POSTGRES_HOST="postgres-db"
    POSTGRES_DB="rh_v2"
    POSTGRES_USER="postgres"
    RETENTION_DAYS=7
    AZURE_STORAGE_ACCOUNT="rhsystembackup"
    AZURE_CONTAINER="postgres-backups"

    # Créer le répertoire de sauvegarde s'il n'existe pas
    mkdir -p $BACKUP_DIR

    # Timestamp pour le nom du fichier
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="$BACKUP_DIR/postgres_${POSTGRES_DB}_${TIMESTAMP}.sql.gz"

    echo "Démarrage de la sauvegarde de la base de données $POSTGRES_DB à $(date)"

    # Exécuter la sauvegarde et la compresser
    PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB | gzip > $BACKUP_FILE

    # Vérifier si la sauvegarde a réussi
    if [ $? -eq 0 ]; then
      echo "Sauvegarde réussie: $BACKUP_FILE ($(du -h $BACKUP_FILE | cut -f1))"

      # Télécharger la sauvegarde vers Azure Blob Storage si configuré
      if [ -n "$AZURE_STORAGE_KEY" ] && [ -n "$AZURE_STORAGE_ACCOUNT" ]; then
        if command -v az >/dev/null 2>&1; then
          echo "Téléchargement de la sauvegarde vers Azure Blob Storage..."
          az storage blob upload --account-name $AZURE_STORAGE_ACCOUNT --account-key $AZURE_STORAGE_KEY --container-name $AZURE_CONTAINER --file $BACKUP_FILE --name $(basename $BACKUP_FILE)
          if [ $? -eq 0 ]; then
            echo "Téléchargement vers Azure Blob Storage réussi"
          else
            echo "Échec du téléchargement vers Azure Blob Storage"
          fi
        else
          echo "Azure CLI (az) n'est pas installé. Ignoré le téléchargement vers Azure Blob Storage."
        fi
      fi
    else
      echo "Échec de la sauvegarde"
      exit 1
    fi

    # Rotation des sauvegardes - supprimer les fichiers plus anciens que RETENTION_DAYS
    echo "Suppression des sauvegardes plus anciennes que $RETENTION_DAYS jours..."
    find $BACKUP_DIR -name "postgres_*.sql.gz" -type f -mtime +$RETENTION_DAYS -delete

    echo "Sauvegarde terminée à $(date)"

  restore.sh: |
    #!/bin/sh
    set -e

    # Configuration
    BACKUP_DIR="/backup"
    POSTGRES_HOST="postgres-db"
    POSTGRES_DB="rh_v2"
    POSTGRES_USER="postgres"
    AZURE_STORAGE_ACCOUNT="rhsystembackup"
    AZURE_CONTAINER="postgres-backups"

    # Vérifier si un fichier de sauvegarde a été spécifié
    if [ -z "$1" ]; then
      echo "Erreur: Aucun fichier de sauvegarde spécifié"
      echo "Usage: $0 <nom_du_fichier_de_sauvegarde>"
      echo "Sauvegardes disponibles:"
      ls -la $BACKUP_DIR
      exit 1
    fi

    BACKUP_FILE="$BACKUP_DIR/$1"

    # Vérifier si le fichier existe localement, sinon essayer de le télécharger depuis Azure
    if [ ! -f "$BACKUP_FILE" ] && [ -n "$AZURE_STORAGE_KEY" ] && [ -n "$AZURE_STORAGE_ACCOUNT" ]; then
      if command -v az >/dev/null 2>&1; then
        echo "Le fichier $BACKUP_FILE n'existe pas localement. Tentative de téléchargement depuis Azure Blob Storage..."
        az storage blob download --account-name $AZURE_STORAGE_ACCOUNT --account-key $AZURE_STORAGE_KEY --container-name $AZURE_CONTAINER --name "$1" --file "$BACKUP_FILE"
        if [ $? -ne 0 ]; then
          echo "Échec du téléchargement depuis Azure Blob Storage"
          exit 1
        fi
      else
        echo "Azure CLI (az) n'est pas installé. Impossible de télécharger depuis Azure Blob Storage."
        echo "Veuillez installer Azure CLI ou utiliser une sauvegarde locale."
        exit 1
      fi
    fi

    # Vérifier à nouveau si le fichier existe
    if [ ! -f "$BACKUP_FILE" ]; then
      echo "Erreur: Le fichier de sauvegarde $BACKUP_FILE n'existe pas"
      exit 1
    fi

    echo "Démarrage de la restauration de la base de données $POSTGRES_DB à partir de $BACKUP_FILE à $(date)"

    # Restaurer la base de données
    gunzip -c $BACKUP_FILE | PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB

    # Vérifier si la restauration a réussi
    if [ $? -eq 0 ]; then
      echo "Restauration réussie à partir de $BACKUP_FILE"
    else
      echo "Échec de la restauration"
      exit 1
    fi

    echo "Restauration terminée à $(date)"

  list-backups.sh: |
    #!/bin/sh
    set -e

    # Configuration
    BACKUP_DIR="/backup"
    AZURE_STORAGE_ACCOUNT="rhsystembackup"
    AZURE_CONTAINER="postgres-backups"

    echo "Sauvegardes locales:"
    ls -la $BACKUP_DIR | grep "postgres_.*\.sql\.gz"

    # Lister les sauvegardes dans Azure Blob Storage si configuré
    if [ -n "$AZURE_STORAGE_KEY" ] && [ -n "$AZURE_STORAGE_ACCOUNT" ]; then
      if command -v az >/dev/null 2>&1; then
        echo -e "\nSauvegardes dans Azure Blob Storage:"
        az storage blob list --account-name $AZURE_STORAGE_ACCOUNT --account-key $AZURE_STORAGE_KEY --container-name $AZURE_CONTAINER --output table
      else
        echo -e "\nAzure CLI (az) n'est pas installé. Impossible de lister les sauvegardes dans Azure Blob Storage."
      fi
    fi
