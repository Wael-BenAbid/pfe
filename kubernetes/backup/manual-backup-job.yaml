apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-manual-backup
  namespace: rh-system
spec:
  template:
    spec:
      containers:
      - name: postgres-backup
        image: postgres:15-alpine
        command:
        - /bin/sh
        - /scripts/backup.sh
        volumeMounts:
        - name: backup-volume
          mountPath: /backup
        - name: backup-scripts
          mountPath: /scripts
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: AZURE_STORAGE_KEY
          value: "default-key-for-development-only"
      restartPolicy: OnFailure
      volumes:
      - name: backup-volume
        persistentVolumeClaim:
          claimName: postgres-backup-pvc
      - name: backup-scripts
        configMap:
          name: postgres-backup-scripts
          defaultMode: 0755
