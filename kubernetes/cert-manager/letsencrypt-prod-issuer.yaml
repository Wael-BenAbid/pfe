apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    cert-manager.io/description: "Émetteur Let's Encrypt Production pour l'environnement de production"
spec:
  acme:
    # URL de l'API ACME de Let's Encrypt Production
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email pour les notifications importantes
    email: waelbenabid1@gmail.com
    # Secret pour stocker la clé privée de l'ACME account
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    # Méthode de validation HTTP01
    solvers:
    # Solveur HTTP01 par défaut
    - http01:
        ingress:
          class: nginx
          podTemplate:
            spec:
              nodeSelector:
                kubernetes.io/os: linux
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 64Mi
    # Solveur DNS01 pour les sous-domaines wildcard
    - selector:
        dnsZones:
        - 'rh-system.local'
      dns01:
        # Configurer votre fournisseur DNS ici
        # Exemple avec Route53 (nécessite des configurations supplémentaires)
        route53:
          region: eu-west-1
          hostedZoneID: HOSTED_ZONE_ID
          accessKeyID: ACCESS_KEY_ID
          secretAccessKeySecretRef:
            name: route53-credentials
            key: secret-access-key
