apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    cert-manager.io/description: "Émetteur Let's Encrypt Staging pour les tests"
spec:
  acme:
    # URL de l'API ACME de Let's Encrypt Staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Email pour les notifications importantes
    email: waelbenabid1@gmail.com
    # Secret pour stocker la clé privée de l'ACME account
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    # Méthode de validation HTTP01
    solvers:
    - http01:
        ingress:
          class: nginx
          podTemplate:
            spec:
              nodeSelector:
                kubernetes.io/os: linux
              tolerations:
              - key: "key1"
                operator: "Equal"
                value: "value1"
                effect: "NoSchedule"
    # Sélecteur pour les domaines spécifiques
    - selector:
        dnsNames:
        - 'api.rh-system.local'
        - 'admin.rh-system.local'
      http01:
        ingress:
          class: nginx
