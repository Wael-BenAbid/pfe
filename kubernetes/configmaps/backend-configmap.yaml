apiVersion: v1
kind: ConfigMap
metadata:
  name: rh-backend-config
  namespace: rh-system
data:
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,rh-backend,rh-frontend,rh-system.local,*"
  DATABASE_NAME: "rh_v2"
  DATABASE_USER: "postgres"
  DATABASE_HOST: "postgres-db"
  DATABASE_PORT: "5432"
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  FRONTEND_URL: "https://rh-system.local"
  CORS_ALLOWED_ORIGINS: "https://rh-system.local,http://rh-system.local,*"
  CSRF_TRUSTED_ORIGINS: "https://rh-system.local,http://rh-system.local,*"
  CORS_ALLOW_CREDENTIALS: "True"
  CORS_ALLOW_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  CORS_ALLOW_HEADERS: "accept,accept-encoding,authorization,content-type,dnt,origin,user-agent,x-csrftoken,x-requested-with"
  ZIPKIN_ENABLED: "True"
  ZIPKIN_SERVER_URL: "http://zipkin.monitoring.svc.cluster.local:9411"
  ZIPKIN_SERVICE_NAME: "rh-backend"
  ZIPKIN_SAMPLE_RATE: "100.0"
  MEDIA_URL: "https://rh-system.local/media/"
  CORS_ALLOW_ALL_ORIGINS: "True"
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
  CSRF_USE_SESSIONS: "True"
  CSRF_COOKIE_HTTPONLY: "False"

