apiVersion: v1
kind: ConfigMap
metadata:
  name: rh-backend-config
  namespace: rh-system
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,rh-backend,rh-frontend,rh-system.local,"
  DATABASE_NAME: "rh_v2"
  DATABASE_USER: "postgres"
  DATABASE_HOST: "postgres-db"
  DATABASE_PORT: "5433"
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  FRONTEND_URL: "https://rh-system.local"
  # Note: Les informations sensibles comme DATABASE_PASSWORD, SECRET_KEY et SENDGRID_API_KEY
  # doivent être stockées dans un Secret Kubernetes, pas dans un ConfigMap
