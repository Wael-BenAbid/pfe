apiVersion: v1
kind: ConfigMap
metadata:
  name: django-urls-config
  namespace: rh-system
data:
  urls.py: |
    """
    URL configuration for SystemeRH project.

    The `urlpatterns` list routes URLs to views. For more information please see:
        https://docs.djangoproject.com/en/5.2/topics/http/urls/
    Examples:
    Function views
        1. Add an import:  from my_app import views
        2. Add a URL to urlpatterns:  path('', views.home, name='home')
    Class-based views
        1. Add an import:  from other_app.views import Home
        2. Add a URL to urlpatterns:  path('', Home.as_view(), name='home')
    Including another URLconf
        1. Import the include() function: from django.urls import include, path
        2. Add a URL to urlpatterns:  path('blog/', include('blog.urls'))
    """
    from django.contrib import admin
    from django.urls import path, include, re_path
    from rest_framework_simplejwt.views import TokenObtainPairView
    from rest_framework.routers import DefaultRouter
    from django.conf import settings
    from django.conf.urls.static import static
    from Rh_app.views import (
        UserViewSet, LeaveViewSet, MissionViewSet,
        WorkHoursViewSet, InternshipViewSet, JobApplicationViewSet,
        UserSessionViewSet, MeetingViewSet, NotificationViewSet,
        SystemActivityViewSet, login_view, api_logout
    )
    from Rh_app.prometheus_metrics_view import metrics_view

    # Importer les correctifs
    import sys
    import os

    # Ajouter le répertoire des correctifs au chemin de recherche
    sys.path.append('/app')

    # Importer le correctif pour get_user_info
    try:
        from get_user_info_fix import get_user_info
        print("Correctif get_user_info importé avec succès")
    except Exception as e:
        print(f"Erreur lors de l'importation du correctif get_user_info: {e}")
        from Rh_app.views import get_user_info

    # Importer le correctif pour MessageViewSet
    try:
        from message_api_fix import MessageViewSet
        print("Correctif MessageViewSet importé avec succès")
    except Exception as e:
        print(f"Erreur lors de l'importation du correctif MessageViewSet: {e}")
        # Si le correctif n'est pas disponible, utiliser une classe vide
        from rest_framework import viewsets
        class MessageViewSet(viewsets.ModelViewSet):
            pass
    from rest_framework_simplejwt.views import TokenVerifyView
    router = DefaultRouter()
    router.register(r'users', UserViewSet)
    router.register(r'leaves', LeaveViewSet)
    router.register(r'missions', MissionViewSet)
    router.register(r'work-hours', WorkHoursViewSet)
    router.register(r'internships', InternshipViewSet)
    router.register(r'job-applications', JobApplicationViewSet)
    router.register(r'user-sessions', UserSessionViewSet)
    router.register(r'meetings', MeetingViewSet)
    router.register(r'notifications', NotificationViewSet)
    router.register(r'system-activities', SystemActivityViewSet)
    router.register(r'messages', MessageViewSet, basename='message')


    from django.http import JsonResponse, HttpResponseRedirect

    def api_root(request):
        return JsonResponse({
            'message': 'RH System API',
            'version': '1.0',
            'status': 'running'
        })

    urlpatterns = [
        path('', api_root, name='api_root'),  # API root endpoint
        path('admin/', admin.site.urls, name='django_admin'),  # Interface d'administration Django
        # Suppression de la route 'django-admin/' pour éviter la confusion

        # Métriques Prometheus
        path('metrics/', metrics_view, name='prometheus-metrics'),
        path('', include('django_prometheus.urls')),

        # Routes sans préfixe api/
        path('', include(router.urls)),  # Routes API sans préfixe
        path('token/', TokenObtainPairView.as_view(), name='token_obtain_pair'),
        path('auth/verify-token/', TokenVerifyView.as_view(), name='token_verify'),
        path('auth/login/', login_view, name='api_login'),
        path('auth/logout/', api_logout, name='api_logout'),

        # Routes avec préfixe api/ (pour compatibilité)
        path('api/', api_root, name='api_root_compat'),  # API root avec préfixe
        path('api/', include(router.urls)),  # Routes API avec préfixe
        path('api/token/', TokenObtainPairView.as_view(), name='token_obtain_pair_compat'),
        path('api/auth/verify-token/', TokenVerifyView.as_view(), name='token_verify_compat'),
        path('api/auth/login/', login_view, name='api_login_compat'),
        path('api/auth/logout/', api_logout, name='api_logout_compat'),

        # Inclure toutes les URLs de l'application Rh_app
        path('', include('Rh_app.urls')),
        path('api/', include('Rh_app.urls')),  # Inclure les URLs avec préfixe api/
    ]

    # Ajouter les URLs pour servir les fichiers média et statiques
    urlpatterns += static(settings.MEDIA_URL, document_root=settings.MEDIA_ROOT)
    urlpatterns += static(settings.STATIC_URL, document_root=settings.STATIC_ROOT)

    # Servir les fichiers statiques de l'admin Django
    from django.contrib.staticfiles.urls import staticfiles_urlpatterns
    urlpatterns += staticfiles_urlpatterns()
