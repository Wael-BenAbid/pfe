apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: rh-system
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        # Configuration des types MIME
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Ajout des types MIME pour les modules JavaScript
        types_hash_max_size 2048;
        types_hash_bucket_size 64;

        # Types MIME personnalisés
        types {
            application/javascript js;
            application/javascript mjs;
            text/css css;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            application/font-woff woff;
            application/font-woff2 woff2;
        }

        # Servir le favicon depuis n'importe quel fichier logo2*.png
        location = /favicon.ico {
            try_files /assets/logo2*.png /assets/logo2-*.png =404;
            add_header Content-Type image/png;
            expires 30d;
            access_log off;
            log_not_found off;
        }

        # Configuration pour les fichiers assets
        location /assets/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri $uri/ =404;

            # Configuration pour tous les fichiers JavaScript dans assets
            location ~* /assets/.*\.(js|mjs)$ {
                add_header Content-Type application/javascript;
                add_header X-Content-Type-Options nosniff;
                expires 30d;
                access_log off;
            }
        }

        # Route pour l'interface d'administration Django
        location /admin/ {
            # Rediriger vers le port-forward local pour l'administration
            # Cette approche contourne complètement les problèmes CSRF
            return 302 http://localhost:8000/admin/;
        }

        # Redirection pour /admin sans slash
        location = /admin {
            return 301 /admin/;
        }

        # Route pour l'API
        location /api/ {
            # Rediriger les requêtes avec doublon api/api vers /api
            rewrite ^/api/api/(.*)$ /api/$1 break;

            proxy_pass http://rh-backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Route pour les médias
        location /media/ {
            proxy_pass http://rh-backend:8000/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ajouter des en-têtes pour le cache et la sécurité
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options "nosniff";

            # Corriger le problème de contenu mixte
            add_header Content-Security-Policy "upgrade-insecure-requests";
        }

        # Route par défaut pour le frontend
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Ajouter l'en-tête Content-Security-Policy pour autoriser les scripts inline
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';";

            # Configuration des types MIME pour les fichiers JavaScript
            location ~* \.(js|mjs)$ {
                add_header Content-Type application/javascript;
                add_header X-Content-Type-Options nosniff;
                expires 30d;
                access_log off;
            }

            # Configuration des types MIME pour les fichiers CSS
            location ~* \.css$ {
                add_header Content-Type text/css;
                expires 30d;
                access_log off;
            }
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
