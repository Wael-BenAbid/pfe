apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: rh-system
data:
  default.conf: |
    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        # Configuration SSL
        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Configuration des types MIME
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Ajout des types MIME pour les modules JavaScript
        types_hash_max_size 2048;
        types_hash_bucket_size 64;

        # Types MIME personnalisés
        types {
            application/javascript js;
            application/javascript mjs;
            text/css css;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            application/font-woff woff;
            application/font-woff2 woff2;
        }

        # Servir le favicon depuis le fichier logo2.png
        location = /favicon.ico {
            alias /usr/share/nginx/html/assets/logo2.png;
            add_header Content-Type image/png;
            expires 30d;
            access_log off;
            log_not_found off;
        }

        # Configuration pour les fichiers assets
        location /assets/ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri $uri/ =404;

            # Configuration pour tous les fichiers JavaScript dans assets
            location ~* /assets/.*\.(js|mjs)$ {
                add_header Content-Type application/javascript;
                add_header X-Content-Type-Options nosniff;
                expires 30d;
                access_log off;
            }
        }

        # Route pour l'interface d'administration Django
        location /admin/ {
            proxy_pass http://rh-backend:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Redirection pour /admin sans slash
        location = /admin {
            return 301 /admin/;
        }

        # Route pour l'API
        location /api/ {
            # Rediriger les requêtes avec doublon api/api vers /api
            rewrite ^/api/api/(.*)$ /api/$1 break;

            proxy_pass http://rh-backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Route pour les médias
        location /media/ {
            proxy_pass http://rh-backend:8000/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route par défaut pour le frontend
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Configuration des types MIME pour les fichiers JavaScript
            location ~* \.(js|mjs)$ {
                add_header Content-Type application/javascript;
                add_header X-Content-Type-Options nosniff;
                expires 30d;
                access_log off;
            }

            # Configuration des types MIME pour les fichiers CSS
            location ~* \.css$ {
                add_header Content-Type text/css;
                expires 30d;
                access_log off;
            }
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
