apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
  namespace: rh-system
data:
  queries.yaml: |
    pg_replication:
      query: "SELECT EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())) as lag"
      metrics:
        - lag:
            usage: "GAUGE"
            description: "Replication lag behind master in seconds"

    pg_postmaster:
      query: "SELECT pg_postmaster_start_time as start_time_seconds from pg_postmaster_start_time()"
      metrics:
        - start_time_seconds:
            usage: "GAUGE"
            description: "Time at which postmaster started"

    pg_stat_user_tables:
      query: |
        SELECT
          schemaname,
          relname,
          seq_scan,
          seq_tup_read,
          idx_scan,
          idx_tup_fetch,
          n_tup_ins,
          n_tup_upd,
          n_tup_del,
          n_tup_hot_upd,
          n_live_tup,
          n_dead_tup,
          n_mod_since_analyze,
          COALESCE(last_vacuum, '1970-01-01Z') as last_vacuum,
          COALESCE(last_autovacuum, '1970-01-01Z') as last_autovacuum,
          COALESCE(last_analyze, '1970-01-01Z') as last_analyze,
          COALESCE(last_autoanalyze, '1970-01-01Z') as last_autoanalyze,
          vacuum_count,
          autovacuum_count,
          analyze_count,
          autoanalyze_count
        FROM
          pg_stat_user_tables
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Schema name"
        - relname:
            usage: "LABEL"
            description: "Table name"
        - seq_scan:
            usage: "COUNTER"
            description: "Number of sequential scans"
        - seq_tup_read:
            usage: "COUNTER"
            description: "Number of sequential tuples read"
        - idx_scan:
            usage: "COUNTER"
            description: "Number of index scans"
        - idx_tup_fetch:
            usage: "COUNTER"
            description: "Number of index tuples fetched"
        - n_tup_ins:
            usage: "COUNTER"
            description: "Number of tuples inserted"
        - n_tup_upd:
            usage: "COUNTER"
            description: "Number of tuples updated"
        - n_tup_del:
            usage: "COUNTER"
            description: "Number of tuples deleted"
        - n_tup_hot_upd:
            usage: "COUNTER"
            description: "Number of tuples hot updated"
        - n_live_tup:
            usage: "GAUGE"
            description: "Number of live tuples"
        - n_dead_tup:
            usage: "GAUGE"
            description: "Number of dead tuples"
        - n_mod_since_analyze:
            usage: "GAUGE"
            description: "Number of tuples modified since last analyze"
        - last_vacuum:
            usage: "GAUGE"
            description: "Last time manual vacuum was run"
        - last_autovacuum:
            usage: "GAUGE"
            description: "Last time autovacuum was run"
        - last_analyze:
            usage: "GAUGE"
            description: "Last time manual analyze was run"
        - last_autoanalyze:
            usage: "GAUGE"
            description: "Last time autovacuum was run"
        - vacuum_count:
            usage: "COUNTER"
            description: "Number of manual vacuums"
        - autovacuum_count:
            usage: "COUNTER"
            description: "Number of autovacuums"
        - analyze_count:
            usage: "COUNTER"
            description: "Number of manual analyzes"
        - autoanalyze_count:
            usage: "COUNTER"
            description: "Number of autovacuum analyzes"
