apiVersion: v1
kind: ConfigMap
metadata:
  name: urls-fix
  namespace: rh-system
data:
  fix-urls.py: |
    #!/usr/bin/env python
    import os
    import sys

    # Path to the urls.py file
    urls_file = '/app/SystemeRH_v2/urls.py'

    # Read the current content
    with open(urls_file, 'r') as f:
        content = f.read()

    # Check if the metrics view is already added
    if 'metrics_view' not in content:
        # Add the import
        if 'from Rh_app.prometheus_metrics_view import metrics_view' not in content:
            import_line = 'from django.contrib import admin'
            new_import = 'from django.contrib import admin\nfrom Rh_app.prometheus_metrics_view import metrics_view'
            content = content.replace(import_line, new_import)

        # Add the URL pattern
        if "path('metrics/', metrics_view, name='prometheus-metrics')," not in content:
            pattern_line = "urlpatterns = ["
            new_pattern = "urlpatterns = [\n    # Prometheus metrics endpoint\n    path('metrics/', metrics_view, name='prometheus-metrics'),"
            content = content.replace(pattern_line, new_pattern)

        # Write the modified content back
        with open(urls_file, 'w') as f:
            f.write(content)
        
        print("URLs file updated successfully.")
    else:
        print("Metrics view already added to URLs file.")
  run-fix.sh: |
    #!/bin/bash
    python /fix-urls.py
