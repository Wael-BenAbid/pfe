apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-backend
  namespace: rh-system
  labels:
    app: rh-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rh-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rh-backend
    spec:
      containers:
      - name: rh-backend
        image: waelbenabid/rh-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: rh-backend-config
              key: DEBUG
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: rh-backend-config
              key: ALLOWED_HOSTS
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: rh-backend-config
              key: DATABASE_NAME
        - name: DATABASE_USER
          valueFrom:
            configMapKeyRef:
              name: rh-backend-config
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rh-backend-secrets
              key: DATABASE_PASSWORD
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: rh-backend-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: rh-backend-config
              key: DATABASE_PORT
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rh-backend-secrets
              key: SECRET_KEY
        - name: EMAIL_HOST_USER
          valueFrom:
            secretKeyRef:
              name: rh-backend-secrets
              key: EMAIL_HOST_USER
        - name: EMAIL_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rh-backend-secrets
              key: EMAIL_HOST_PASSWORD
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: rh-backend-secrets
              key: SENDGRID_API_KEY
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
      restartPolicy: Always
