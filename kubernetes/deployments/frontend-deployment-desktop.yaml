apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-frontend
  namespace: rh-system
  labels:
    app: rh-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rh-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics.json"
        prometheus.io/port: "80"
      labels:
        app: rh-frontend
    spec:
      containers:
      - name: rh-frontend
        image: waelbenabid/rh-frontend-desktop:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: VITE_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: rh-frontend-config
              key: API_BASE_URL
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: metrics-config
          mountPath: /usr/share/nginx/html/metrics.json
          subPath: metrics.json
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: metrics-config
        configMap:
          name: frontend-metrics
      restartPolicy: Always
