apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-frontend
  namespace: rh-system
  labels:
    app: rh-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rh-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/frontend-metrics"
        prometheus.io/port: "80"
        prometheus.io/scheme: "http"
      labels:
        app: rh-frontend
    spec:
      initContainers:
      - name: create-env-js
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo 'window.ENV = {
            VITE_API_BASE_URL: "//rh-system.local",
            VITE_ZIPKIN_URL: "/zipkin",
            VITE_ZIPKIN_ENABLED: "true"
          };' > /usr/share/nginx/html/env.js
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      containers:
      - name: rh-frontend
        image: waelbenabid/rh-frontend:v2.2
        imagePullPolicy: Never
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: VITE_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: rh-frontend-config
              key: API_BASE_URL
        - name: VITE_ZIPKIN_URL
          valueFrom:
            configMapKeyRef:
              name: rh-frontend-config
              key: VITE_ZIPKIN_URL
        - name: VITE_ZIPKIN_ENABLED
          valueFrom:
            configMapKeyRef:
              name: rh-frontend-config
              key: VITE_ZIPKIN_ENABLED
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: html-volume
        emptyDir: {}
      restartPolicy: Always
