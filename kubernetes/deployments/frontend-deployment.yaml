apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-frontend
  namespace: rh-system
  labels:
    app: rh-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rh-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rh-frontend
    spec:
      containers:
      - name: rh-frontend
        image: waelbenabid/rh-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: VITE_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: rh-frontend-config
              key: API_BASE_URL
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 20
          periodSeconds: 15
      restartPolicy: Always