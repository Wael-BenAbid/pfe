apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: rh-system
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      containers:
      - name: postgres-exporter
        image: bitnami/postgres-exporter:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9187
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://postgres:postgres@postgres-db:5432/postgres?sslmode=disable"
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres-exporter/queries.yaml"
        volumeMounts:
        - name: postgres-exporter-config
          mountPath: /etc/postgres-exporter
      volumes:
      - name: postgres-exporter-config
        configMap:
          name: postgres-exporter-config
      restartPolicy: Always
