apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-frontend
  namespace: rh-system
  labels:
    app: rh-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rh-frontend
  template:
    metadata:
      labels:
        app: rh-frontend
    spec:
      containers:
      - name: rh-frontend
        image: waelbenabid/rh-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: VITE_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: rh-frontend-config
              key: API_BASE_URL
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: ssl-certs
          mountPath: /etc/nginx/ssl
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: ssl-certs
        secret:
          secretName: rh-system-tls
