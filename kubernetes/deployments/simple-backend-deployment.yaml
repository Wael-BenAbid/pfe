apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-backend
  namespace: rh-system
  labels:
    app: rh-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rh-backend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
      labels:
        app: rh-backend
    spec:
      containers:
      - name: rh-backend
        image: waelbenabid/rh-backend-desktop:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: DATABASE_HOST
          value: "postgres-db"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: "rh_v2"
        - name: DATABASE_USER
          value: "postgres"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rh-backend-secrets
              key: DATABASE_PASSWORD
        - name: ALLOWED_HOSTS
          value: "*"
        - name: DEBUG
          value: "True"
        volumeMounts:
        - name: prometheus-metrics-fix
          mountPath: /app/Rh_app/prometheus_metrics_view.py
          subPath: prometheus_metrics_view.py
        - name: urls-fix
          mountPath: /fix-urls.py
          subPath: fix-urls.py
        - name: urls-fix
          mountPath: /run-fix.sh
          subPath: run-fix.sh
      volumes:
      - name: prometheus-metrics-fix
        configMap:
          name: prometheus-metrics-fix
      - name: urls-fix
        configMap:
          name: urls-fix
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: rh-backend
  namespace: rh-system
spec:
  selector:
    app: rh-backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
