apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-frontend
  namespace: rh-system
  labels:
    app: rh-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rh-frontend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics.json"
        prometheus.io/port: "80"
      labels:
        app: rh-frontend
    spec:
      containers:
      - name: rh-frontend
        image: waelbenabid/rh-frontend-desktop:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: metrics-config
          mountPath: /usr/share/nginx/html/metrics.json
          subPath: metrics.json
      volumes:
      - name: metrics-config
        configMap:
          name: frontend-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: rh-frontend
  namespace: rh-system
spec:
  selector:
    app: rh-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
