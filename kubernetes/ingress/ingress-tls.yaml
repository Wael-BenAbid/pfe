apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri $uri/ =404;
      }
    cert-manager.io/cluster-issuer: "selfsigned-issuer"  # Utiliser selfsigned-issuer pour le développement
  name: rh-system-ingress
  namespace: rh-system
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - rh-system.local
    secretName: rh-system-tls
  rules:
  - host: rh-system.local  # Remplacez par votre domaine réel en production
    http:
      paths:
      - backend:
          service:
            name: rh-backend
            port:
              number: 8000
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: rh-backend
            port:
              number: 8000
        path: /admin
        pathType: Prefix
      - backend:
          service:
            name: rh-frontend
            port:
              number: 80
        path: /
        pathType: Prefix
