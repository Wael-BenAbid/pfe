apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/rewrite-target: /admin/$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  name: rh-system-ingress
  namespace: rh-system
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - rh-system.local
    secretName: rh-system-tls
  rules:
  - host: rh-system.local
    http:
      paths:
      - backend:
          service:
            name: rh-backend
            port:
              number: 8000
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: rh-frontend
            port:
              number: 80
        path: /admin
        pathType: Prefix
      - backend:
          service:
            name: rh-backend
            port:
              number: 8000
        path: /django-admin(/|$)(.*)
        pathType: ImplementationSpecific
      - backend:
          service:
            name: rh-frontend
            port:
              number: 80
        path: /
        pathType: Prefix