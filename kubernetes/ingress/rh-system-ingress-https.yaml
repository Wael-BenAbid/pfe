apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rh-system-ingress
  namespace: rh-system
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: rh-system.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: rh-backend
            port:
              number: 8000
      - path: /admine
        pathType: Prefix
        backend:
          service:
            name: rh-frontend
            port:
              number: 80
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: rh-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rh-frontend
            port:
              number: 80
  tls:
  - hosts:
    - rh-system.local
    secretName: rh-system-tls
