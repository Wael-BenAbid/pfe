apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: logging
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    path.config: /usr/share/logstash/pipeline
    xpack.monitoring.enabled: true
    xpack.monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]

  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
      # Check for app field added by Filebeat
      if [app] == "rh-system" {
        mutate {
          add_field => { "[@metadata][system]" => "rh-system" }
        }
      }

      # Process frontend logs
      if [kubernetes][labels][app] == "rh-frontend" or [kubernetes][container][name] =~ /^rh-frontend/ {
        mutate {
          add_field => { "[@metadata][app_type]" => "frontend" }
        }
        grok {
          match => { "message" => "%{COMBINEDAPACHELOG}" }
        }
      }

      # Process backend logs
      if [kubernetes][labels][app] == "rh-backend" or [kubernetes][container][name] =~ /^rh-backend/ {
        mutate {
          add_field => { "[@metadata][app_type]" => "backend" }
        }
        grok {
          match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:log_message}" }
        }
      }

      # Process database logs
      if [kubernetes][labels][app] == "postgres-db" or [kubernetes][container][name] =~ /^postgres-db/ {
        mutate {
          add_field => { "[@metadata][app_type]" => "database" }
        }
        grok {
          match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:log_level} %{GREEDYDATA:log_message}" }
        }
      }

      # Tag error logs
      if [log_level] == "ERROR" or [log_level] == "FATAL" {
        mutate {
          add_tag => ["error"]
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        index => "rh-system-logs-%{[@metadata][app_type]}-%{+YYYY.MM.dd}"
        document_type => "_doc"
        manage_template => false
      }
    }
