apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-prometheus-fix
  namespace: rh-system
data:
  install-prometheus.sh: |
    #!/bin/bash
    
    # Installer django-prometheus
    echo "Installing django-prometheus..."
    pip install django-prometheus
    
    # Modifier settings.py
    echo "Configuring django-prometheus in settings.py..."
    SETTINGS_FILE="/app/SystemeRH_v2/settings.py"
    
    # Vérifier si django_prometheus est déjà dans INSTALLED_APPS
    if ! grep -q "django_prometheus" "$SETTINGS_FILE"; then
      # Ajouter django_prometheus aux INSTALLED_APPS
      sed -i "s/INSTALLED_APPS = \[/INSTALLED_APPS = \[\n    'django_prometheus',/" "$SETTINGS_FILE"
      
      # Ajouter les middlewares Prometheus
      sed -i "s/MIDDLEWARE = \[/MIDDLEWARE = \[\n    'django_prometheus.middleware.PrometheusBeforeMiddleware',/" "$SETTINGS_FILE"
      sed -i "s/]  # Middleware pour vérifier les missions en retard/,\n    'django_prometheus.middleware.PrometheusAfterMiddleware'\n]  # Middleware pour vérifier les missions en retard/" "$SETTINGS_FILE"
      
      echo "django-prometheus added to settings.py"
    else
      echo "django-prometheus already in settings.py"
    fi
    
    # Modifier urls.py
    echo "Configuring django-prometheus in urls.py..."
    URLS_FILE="/app/SystemeRH_v2/urls.py"
    
    # Vérifier si django_prometheus.urls est déjà inclus
    if ! grep -q "django_prometheus.urls" "$URLS_FILE"; then
      # Ajouter l'import include s'il n'existe pas
      if ! grep -q "from django.urls import path, include" "$URLS_FILE"; then
        sed -i "s/from django.urls import path/from django.urls import path, include/" "$URLS_FILE"
      fi
      
      # Ajouter l'URL des métriques Prometheus
      sed -i "s/urlpatterns = \[/urlpatterns = \[\n    path('', include('django_prometheus.urls')),/" "$URLS_FILE"
      
      echo "django-prometheus URLs added to urls.py"
    else
      echo "django-prometheus URLs already in urls.py"
    fi
    
    # Copier les fichiers de métriques personnalisés
    echo "Copying custom metrics files..."
    
    # Copier prometheus_metrics_view.py
    if [ -f "/app/Rh_app/prometheus_metrics_view.py" ]; then
      echo "prometheus_metrics_view.py already exists, updating..."
    fi
    cp -f /app/Rh_app/prometheus_metrics_view.py /app/Rh_app/prometheus_metrics_view.py.bak || true
    cp -f /app/message_view_fix/prometheus_metrics_view.py /app/Rh_app/prometheus_metrics_view.py
    
    # Copier prometheus_metrics.py
    if [ -f "/app/Rh_app/prometheus_metrics.py" ]; then
      echo "prometheus_metrics.py already exists, updating..."
    fi
    cp -f /app/Rh_app/prometheus_metrics.py /app/Rh_app/prometheus_metrics.py.bak || true
    cp -f /app/message_view_fix/prometheus_metrics.py /app/Rh_app/prometheus_metrics.py
    
    # Ajouter la vue de métriques personnalisée à urls.py
    if ! grep -q "prometheus_metrics_view" "$URLS_FILE"; then
      # Ajouter l'import
      sed -i "/from django.urls import/a from Rh_app.prometheus_metrics_view import metrics_view" "$URLS_FILE"
      
      # Ajouter l'URL
      sed -i "/urlpatterns = \[/a \ \ \ \ path('metrics/', metrics_view, name='prometheus-metrics')," "$URLS_FILE"
      
      echo "Custom metrics view added to urls.py"
    else
      echo "Custom metrics view already in urls.py"
    fi
    
    # Ajouter le middleware personnalisé à settings.py
    if ! grep -q "prometheus_metrics.PrometheusMiddleware" "$SETTINGS_FILE"; then
      # Ajouter l'import
      sed -i "/^import os/a import Rh_app.prometheus_metrics" "$SETTINGS_FILE"
      
      # Ajouter le middleware
      sed -i "s/'django_prometheus.middleware.PrometheusAfterMiddleware'/'django_prometheus.middleware.PrometheusAfterMiddleware',\n    'Rh_app.prometheus_metrics.PrometheusMiddleware'/" "$SETTINGS_FILE"
      
      echo "Custom metrics middleware added to settings.py"
    else
      echo "Custom metrics middleware already in settings.py"
    fi
    
    echo "django-prometheus configuration completed"
