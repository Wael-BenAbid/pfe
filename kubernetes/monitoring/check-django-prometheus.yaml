apiVersion: batch/v1
kind: Job
metadata:
  name: check-django-prometheus
  namespace: rh-system
spec:
  template:
    spec:
      containers:
      - name: check-django-prometheus
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          # Vérifier l'installation de django-prometheus dans le pod backend
          BACKEND_POD=$(kubectl get pods -n rh-system -l app=rh-backend -o jsonpath="{.items[0].metadata.name}")
          
          echo "Vérification de l'installation de django-prometheus dans le pod $BACKEND_POD"
          
          # Vérifier si django-prometheus est installé
          kubectl exec -n rh-system $BACKEND_POD -- pip list | grep django-prometheus
          
          if [ $? -ne 0 ]; then
            echo "django-prometheus n'est pas installé. Installation en cours..."
            kubectl exec -n rh-system $BACKEND_POD -- pip install django-prometheus
          else
            echo "django-prometheus est déjà installé."
          fi
          
          # Vérifier la configuration de django-prometheus dans settings.py
          echo "Vérification de la configuration de django-prometheus dans settings.py"
          
          kubectl exec -n rh-system $BACKEND_POD -- python -c "
          import os
          
          # Vérifier settings.py
          settings_path = '/app/SystemeRH_v2/settings.py'
          with open(settings_path, 'r') as f:
              content = f.read()
          
          # Vérifier si django_prometheus est dans INSTALLED_APPS
          if 'django_prometheus' not in content:
              print('django_prometheus n\'est pas dans INSTALLED_APPS. Ajout en cours...')
              
              # Ajouter django_prometheus à INSTALLED_APPS
              apps_line = 'INSTALLED_APPS = ['
              apps_section = content.split(apps_line)[1].split(']')[0]
              if 'django_prometheus' not in apps_section:
                  new_apps_section = apps_section + '    \"django_prometheus\",\\n'
                  content = content.replace(apps_section, new_apps_section)
              
              # Ajouter django_prometheus.middleware.PrometheusBeforeMiddleware au début de MIDDLEWARE
              middleware_line = 'MIDDLEWARE = ['
              middleware_section = content.split(middleware_line)[1].split(']')[0]
              if 'django_prometheus.middleware.PrometheusBeforeMiddleware' not in middleware_section:
                  new_middleware_section = '    \"django_prometheus.middleware.PrometheusBeforeMiddleware\",\\n' + middleware_section
                  content = content.replace(middleware_section, new_middleware_section)
              
              # Ajouter django_prometheus.middleware.PrometheusAfterMiddleware à la fin de MIDDLEWARE
              if 'django_prometheus.middleware.PrometheusAfterMiddleware' not in middleware_section:
                  new_middleware_section = middleware_section + '    \"django_prometheus.middleware.PrometheusAfterMiddleware\",\\n'
                  content = content.replace(middleware_section, new_middleware_section)
              
              # Écrire les modifications
              with open(settings_path, 'w') as f:
                  f.write(content)
              
              print('django_prometheus a été ajouté à la configuration.')
          else:
              print('django_prometheus est déjà configuré dans settings.py.')
          "
          
          # Redémarrer le pod backend pour appliquer les modifications
          echo "Redémarrage du pod backend pour appliquer les modifications"
          kubectl delete pod -n rh-system $BACKEND_POD
      restartPolicy: Never
