apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8080'
spec:
  selector:
    app: kube-state-metrics
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http-metrics
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: telemetry
  type: ClusterIP
