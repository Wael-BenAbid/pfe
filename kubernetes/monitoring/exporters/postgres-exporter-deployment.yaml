apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: rh-system
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
      labels:
        app: postgres-exporter
    spec:
      containers:
      - name: postgres-exporter
        image: bitnami/postgres-exporter:latest
        ports:
        - containerPort: 9187
          name: http
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://postgres:postgres@postgres-db:5432/rh_v2?sslmode=disable"
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: /etc/postgres-exporter/queries.yaml
        volumeMounts:
        - name: postgres-exporter-config
          mountPath: /etc/postgres-exporter
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: postgres-exporter-config
        configMap:
          name: postgres-exporter-config
