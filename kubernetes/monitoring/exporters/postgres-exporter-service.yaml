apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: monitoring
  labels:
    app: postgres-exporter
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9187'
spec:
  selector:
    app: postgres-exporter
  ports:
  - port: 9187
    targetPort: 9187
    protocol: TCP
    name: metrics
  type: ClusterIP
