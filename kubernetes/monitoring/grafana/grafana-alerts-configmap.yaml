apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts
  namespace: monitoring
data:
  cpu-usage-alert.yaml: |
    apiVersion: 1
    groups:
      - name: cpu-usage
        folder: Alerts
        interval: 60s
        rules:
          - uid: high_cpu_usage
            title: High CPU Usage
            name: High CPU Usage
            condition: B
            data:
              - refId: A
                datasourceUid: Prometheus
                model:
                  expr: sum(rate(container_cpu_usage_seconds_total{namespace="rh-system", container!=""}[5m])) by (pod)
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
              - refId: B
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.8
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  refId: B
                  type: classic_conditions
            noDataState: NoData
            execErrState: Error
            for: 5m
            isPaused: false
