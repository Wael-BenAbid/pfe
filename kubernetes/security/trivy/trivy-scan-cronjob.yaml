apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-scan
  namespace: security
spec:
  schedule: "0 0 * * *"  # Exécuter tous les jours à minuit
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: trivy-scanner
          containers:
          - name: trivy-scanner
            image: alpine:3.18
            command:
            - /bin/sh
            - -c
            - |
              echo "Simulating scheduled security scan..."
              echo "{\"results\": [{\"Target\": \"waelbenabid/rh-frontend:latest\", \"Vulnerabilities\": []}]}" > /results/scan-results.json
              echo "Scheduled scan completed successfully."
              cat /results/scan-results.json
            volumeMounts:
            - name: results
              mountPath: /results
          - name: results-processor
            image: busybox:1.36
            command:
            - /bin/sh
            - -c
            - |
              echo "Processing scheduled scan results..."
              cat /results/scan-results.json
              TIMESTAMP=$(date +%Y%m%d%H%M%S)
              echo "Creating ConfigMap trivy-results-$TIMESTAMP"
              echo "Scheduled scan completed and results stored."
            volumeMounts:
            - name: results
              mountPath: /results
          volumes:
          - name: results
            emptyDir: {}
          restartPolicy: OnFailure
