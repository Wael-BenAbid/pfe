# Support pour les WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Configuration pour les sessions et les cookies
    proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Strict";

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ajout des directives pour la gestion des cookies et des sessions
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path /api/ /api/;
        proxy_cookie_domain backend localhost;

        # Augmenter les timeouts pour éviter les déconnexions
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Support pour les WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Serve media files from the backend
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ajout des directives pour la gestion des cookies et des sessions
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path /media/ /media/;
        proxy_cookie_domain backend localhost;

        # Augmenter les timeouts pour éviter les déconnexions
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Support pour les WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Admin interface (frontend)
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Django admin interface (redirects to /admin/)
    location /django-admin/ {
        proxy_pass http://backend:8000/django-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ajout des directives pour la gestion des cookies et des sessions
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path /django-admin/ /django-admin/;
        proxy_cookie_domain backend localhost;

        # Augmenter les timeouts pour éviter les déconnexions
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Support pour les WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Désactiver la mise en cache pour les pages d'administration
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
